<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. Vertical Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light py-5">
    <div class="container d-flex justify-content-center">
        <div class="card border-info" style="max-width: 450px; width: 100%;">
            <div class="card-header bg-info bg-opacity-10 text-primary border-info">
                <h5 class="card-title mb-0 fs-6 fw-normal">Biểu mẫu đăng nhập</h5>
            </div>
            <div class="card-body p-4">
                <form>
                    <div class="mb-3">
                        <label for="vEmail" class="form-label fw-bold">Email:</label>
                        <input type="email" class="form-control" id="vEmail" placeholder="Nhập vào email">
                    </div>

                    <div class="mb-3">
                        <label for="vPassword" class="form-label fw-bold">Password:</label>
                        <input type="password" class="form-control" id="vPassword" placeholder="Nhập vào mật khẩu">
                    </div>

                    <div class="mb-3 form-check">
                        <input class="form-check-input" type="checkbox" id="vCheck">
                        <label class="form-check-label" for="vCheck">Ghi nhớ tôi</label>
                    </div>

                    <button type="submit" class="btn btn-primary px-4">Đăng nhập</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
