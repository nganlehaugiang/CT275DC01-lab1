<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Horizontal Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light py-5">
    <div class="container d-flex justify-content-center">
        <div class="card border-info" style="max-width: 550px; width: 100%;">
            <div class="card-header bg-info bg-opacity-10 text-primary border-info">
                <h5 class="card-title mb-0 fs-6 fw-normal">Biểu mẫu đăng nhập</h5>
            </div>
            <div class="card-body p-4">
                <form>
                    <div class="row mb-3 align-items-center">
                        <label for="hEmail" class="col-sm-3 col-form-label text-sm-end fw-bold">Email:</label>
                        <div class="col-sm-9">
                            <input type="email" class="form-control" id="hEmail" placeholder="Nhập vào email">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="hPassword" class="col-sm-3 col-form-label text-sm-end fw-bold">Mật khẩu:</label>
                        <div class="col-sm-9">
                            <input type="password" class="form-control" id="hPassword" placeholder="Nhập vào mật khẩu">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-9 offset-sm-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="hCheck">
                                <label class="form-check-label" for="hCheck">Ghi nhớ tôi</label>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-9 offset-sm-3">
                            <button type="submit" class="btn btn-primary px-4">Đăng nhập</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
