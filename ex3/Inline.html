<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3. Inline Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-light py-5">
    <div class="container d-flex justify-content-center">
        <div class="card border-0 shadow-sm" style="max-width: 750px; width: 100%;">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="card-title mb-0 fs-6 fw-bold">Biểu mẫu đăng nhập</h5>
            </div>
            <div class="card-body p-4">
                <form class="row row-cols-lg-auto g-3 align-items-center">
                    <div class="col-12">
                        <div class="input-group">
                            <span class="input-group-text bg-light text-secondary"><i
                                    class="fa-solid fa-user"></i></span>
                            <input type="email" class="form-control" placeholder="Nhập vào email">
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="input-group">
                            <span class="input-group-text bg-light text-secondary"><i
                                    class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" placeholder="Nhập vào mật khẩu">
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="inlineCheck">
                            <label class="form-check-label" for="inlineCheck">Ghi nhớ tôi</label>
                        </div>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary px-4">Đăng nhập</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
