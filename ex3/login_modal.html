<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4. Login Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-light py-5">

    <div class="container d-flex justify-content-center">
        <!-- Khối kích hoạt -->
        <div class="p-4 border border-danger rounded bg-white text-center" style="max-width: 400px; width: 100%;">
            <h2 class="fw-normal mb-3 fs-3">Mở biểu mẫu đăng nhập</h2>
            <button type="button" class="btn btn-info text-white px-4 py-2" data-bs-toggle="modal"
                data-bs-target="#loginModal">
                Mở hộp thoại
            </button>
        </div>

        <!-- Hộp thoại Modal -->
        <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header border-bottom-0 pb-0">
                        <h5 class="modal-title w-100 text-center fs-3 fw-bold">
                            <i class="fa-solid fa-lock"></i> Đăng nhập
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body p-4">
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-bold"><i class="fa-solid fa-user"></i> Người dùng:</label>
                                <input type="text" class="form-control" placeholder="Nhập tên người dùng">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold"><i class="fa-solid fa-eye"></i> Mật khẩu:</label>
                                <input type="password" class="form-control" placeholder="Nhập mật khẩu">
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="modalCheck">
                                <label class="form-check-label" for="modalCheck">Ghi nhớ tôi</label>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                                <i class="fa-solid fa-power-off"></i> Đăng nhập
                            </button>
                        </form>
                    </div>

                    <div class="modal-footer d-flex justify-content-between align-items-center bg-light">
                        <button type="button" class="btn btn-danger px-3" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> Hủy bỏ
                        </button>
                        <div class="text-end small">
                            <p class="mb-1 text-muted">Bạn chưa phải là thành viên? <a href="#"
                                    class="text-decoration-none">Đăng ký</a></p>
                            <p class="mb-0">Quên <a href="#" class="text-decoration-none">mật khẩu?</a></p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
